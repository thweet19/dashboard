name: Update Dashboard Data

on:
  schedule:
    - cron: '0 1,13 * * *'  # KST 오전 10:00 / 오후 10:00
  workflow_dispatch:          # 수동 실행 허용

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data from Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: python scripts/fetch_from_drive.py

      - name: Inject dashboard password
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          sed -i "s/const PASS = \"CHANGE_ME\"/const PASS = \"${DASHBOARD_PASSWORD}\"/" index.html

      - name: Commit & push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json index.html
          git diff --staged --quiet || (
            git commit -m "data: 매출 데이터 업데이트 $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')" &&
            git push
          )
